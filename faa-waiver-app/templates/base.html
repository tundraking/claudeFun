<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FAA Waiver Browser{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .navbar { background-color: #003366 !important; }
    .table thead th {
      background-color: #003366;
      color: #fff;
      white-space: nowrap;
      vertical-align: middle;
    }
    .sort-link { color: #fff; text-decoration: none; }
    .sort-link:hover { color: #aed6f1; text-decoration: underline; }
    .pdf-text {
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.82em;
      background: #f9f9f9;
      border: 1px solid #dee2e6;
      padding: 12px;
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark">
    <div class="container-xl">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-airplane me-2"></i>FAA Part 107 Waiver Browser
      </a>
    </div>
  </nav>

  <main class="container-xl py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
