{% extends "base.html" %}

{% block title %}Waiver Map — FAA Waiver Browser{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3 gap-2">
  <h4 class="mb-0"><i class="bi bi-map me-2"></i>Geocoded Waivers</h4>
  <span class="text-muted small" id="marker-count"></span>
</div>
<div id="map" style="height: 72vh; border-radius: 8px; border: 1px solid #dee2e6;"></div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([38.5, -96], 4);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  fetch('/api/waivers/geo')
    .then(r => r.json())
    .then(waivers => {
      document.getElementById('marker-count').textContent = `(${waivers.length} waivers)`;
      waivers.forEach(w => {
        const popup = `
          <strong>${w.waiver_number || '—'}</strong><br>
          ${w.company_name ? w.company_name + '<br>' : ''}
          ${w.responsible_person || ''}
          <br><a href="/waiver/${encodeURIComponent(w.waiver_number)}" target="_blank">View waiver →</a>
        `;
        L.marker([w.latitude, w.longitude]).addTo(map).bindPopup(popup);
      });
    });
</script>
{% endblock %}
